AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation 3-tier topology sample

Resources:
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.16.0.0/16

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 172.16.1.0/24

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.large
      SubnetId: !Ref PublicSubnet

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.small
      Engine: postgres
      VpcId: !Ref MyVPC
    DependsOn: WebServer

  StaticStorage:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: my-cloudformation-assets
